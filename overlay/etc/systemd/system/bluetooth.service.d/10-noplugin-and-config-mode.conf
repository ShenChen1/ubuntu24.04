# Ubuntu packages /etc/bluetooth with mode 0755 while bluez ships 0555 in its
# unit file, and this board does not enable D-Bus experimental profiles
# (LE Audio / dummy SAP) or kernel BNEP (Bluetooth PAN).
[Service]
ConfigurationDirectoryMode=0755
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap,network,csip,micp,vcp,mcp,bass,bap
